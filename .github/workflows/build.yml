name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK using Kivy Docker Image
        run: |
          docker run --rm -v "${{ github.workspace }}":/home/user/hostcwd -w /home/user/hostcwd kivy/buildozer:latest buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mehrlab-apk
          path: bin/*.apk
