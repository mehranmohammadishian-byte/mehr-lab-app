name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK using Kivy Docker Image
        uses: addnab/docker-run-action@v3
        with:
          image: kivy/buildozer:latest
          options: -v ${{ github.workspace }}:/home/user/app -w /home/user/app
          run: |
            buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mehrlab-apk
          path: bin/*.apk
